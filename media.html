<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media – Synergia Piano Trio</title>
    <meta name="description" content="Videos, Audio und Bildmaterial des Synergia Piano Trio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="page-veil" aria-hidden="true"></div>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="index.html">Synergia Piano Trio</a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="trio.html" data-i18n="navTrio">Trio</a>
        <a href="termine.html" data-i18n="navConcerts">Concerts</a>
        <a href="media.html" data-i18n="navMedia">Media</a>
        <a href="programme.html" data-i18n="navRepertoire">Programs</a>
        <a href="kontakt.html" data-i18n="navContact">Contact</a>
      </nav>
      <div class="lang-switch" aria-label="Sprachauswahl">
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn is-active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </header>

    <main>

      <!-- Video -->
      <section class="section">
        <div class="section-head split-head glass-panel">
          <h2>Video</h2>
        </div>
        <div class="panel media-video-panel">
          <div class="embed-wrap--ratio">
            <iframe
              src="https://www.youtube.com/embed/6Oop1uTcaS0?si=QQJoALY1qy406Cfe"
              title="Synergia Piano Trio – YouTube"
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>

      <!-- Audio -->
      <section class="section">
        <div class="section-head split-head glass-panel">
          <h2>Audio</h2>
        </div>
        <div class="panel tidal-block">
          <a class="btn" data-i18n="tidalBtn">Listen on Tidal</a>
        </div>
      </section>

      <!-- Fotos -->
      <section class="section">
        <div class="section-head split-head glass-panel">
          <h2>Fotos</h2>
        </div>
        <div class="media-photo-grid">
          <figure class="media-photo-item panel">
            <img
              src="assets/Synergia_Piano_Trio-32.png"
              alt="Synergia Piano Trio"
              loading="lazy"
            />
          </figure>
          <figure class="media-photo-item panel">
            <img
              src="assets/Synergia_Piano_Trio-34.png"
              alt="Synergia Piano Trio"
              loading="lazy"
            />
          </figure>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>Synergia Piano Trio</p>
      <p><a href="mailto:synergia.piano.trio@gmail.com">synergia.piano.trio@gmail.com</a></p>
      <p class="small"><a href="rechtliches.html" data-i18n="legalLink">Impressum &amp; Datenschutz</a></p>
    </footer>

    <script src="assets/script.js"></script>
  </body>
</html>
